<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f8f6" />
  <title>Ginjer · IoT Monitor</title>
  <link rel="stylesheet" href=".od-frames/layout.css" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <style>
    :root {
      --phone-screen-width: 360px;
      --phone-screen-height: 800px;
      --phone-safe-top: 0px;
      --phone-safe-bottom: 28px;
      --phone-bezel: 10px;
      --phone-screen-radius: 40px;
      --phone-outer-radius: 50px;
      --phone-screen-bg: #f7f8f5;
      --phone-stage-bg: #e8e9e6;
      --green: #81af27;
      --green-dark: #6d9820;
      --green-pale: #edf5df;
      --ink: #262a2c;
      --muted: #8b9091;
      --line: #eceeeb;
      --surface: #fff;
      --canvas: #f7f8f5;
      --red: #f16e63;
      --amber: #f2bd4b;
      --blue: #36a9d4;
      --shadow: 0 3px 12px rgba(34, 43, 29, .075);
      --shadow-soft: 0 2px 8px rgba(34, 43, 29, .06);
      --radius-card: 13px;
      --font: Roboto, "Arial", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #fbfcfa 0, transparent 38%), var(--phone-stage-bg); color: var(--ink); font-family: var(--font); }
    button, input, select { color: inherit; font: inherit; }
    button { cursor: pointer; }
    .phone-frame { position: relative; width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2); height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2); padding: var(--phone-bezel); border-radius: var(--phone-outer-radius); background: linear-gradient(145deg, #41454a, #181a1d 56%, #08090a); box-shadow: inset 0 0 0 1px #ffffff29, 0 28px 68px -22px #11151d88, 0 8px 20px #11151d35; isolation: isolate; }
    .phone-frame::before, .phone-frame::after { content: ""; position: absolute; z-index: -1; top: 100px; bottom: 100px; width: 2px; background: linear-gradient(transparent, #ffffff22 20%, transparent 42%, transparent 72%, #ffffff14 90%, transparent); }
    .phone-frame::before { left: 0; } .phone-frame::after { right: 0; }
    .hardware-button { position: absolute; width: 4px; border-radius: 3px; background: linear-gradient(90deg,#08090b,#2a2d33 60%,#08090b); }
    .hardware-button.volume { left: -3px; top: 215px; height: 82px; } .hardware-button.power { right: -3px; top: 264px; height: 78px; }
    .phone-screen { position: relative; width: var(--phone-screen-width); height: var(--phone-screen-height); overflow: hidden; border-radius: var(--phone-screen-radius); background: var(--canvas); }
    .phone-content { position: absolute; inset: 0; overflow: hidden; padding: 0; background: var(--canvas); }
    .app { position: absolute; inset: 0 0 var(--phone-safe-bottom); display: grid; grid-template-rows: minmax(0,1fr) auto; min-height: 0; background: var(--canvas); }
    .app.no-tabs { grid-template-rows: minmax(0,1fr); }
    .screen { min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: none; background: var(--canvas); }
    .screen::-webkit-scrollbar { display: none; }
    .view-pad { padding: 12px 16px 22px; }
    .top-search { min-height: 45px; display: flex; align-items: center; gap: 5px; padding: 0 6px 0 12px; border-radius: 12px; background: #fff; box-shadow: var(--shadow-soft); }
    .top-search input { flex: 1; min-width: 0; height: 42px; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; }
    .top-search input::placeholder { color: #b0b4b2; opacity: 1; }
    .icon-btn { width: 34px; height: 36px; padding: 0; border: 0; display: inline-grid; place-items: center; border-radius: 9px; background: transparent; color: #6c7371; }
    .icon-btn:hover, .icon-btn:focus-visible { color: var(--green-dark); background: #f3f7ed; outline: none; }
    .icon-btn svg, .line-icon { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; margin: 17px 2px 10px; }
    .section-heading h1, .section-heading h2 { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 650; letter-spacing: -.25px; }
    .section-heading .count { color: var(--muted); font-size: 11px; }
    .device-list { display: grid; gap: 9px; }
    .device-card { min-height: 111px; position: relative; display: grid; grid-template-columns: 53px minmax(0,1fr) 65px; gap: 9px; padding: 11px 10px; border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow); cursor: pointer; transition: transform .16s ease, box-shadow .16s ease; }
    .device-card:active { transform: scale(.99); box-shadow: var(--shadow-soft); }
    .device-visual { width: 52px; height: 55px; align-self: start; display: grid; place-items: center; border-radius: 10px; background: #f3f6ef; color: #6e932f; }
    .device-visual svg { width: 39px; height: 39px; overflow: visible; }
    .device-main { min-width: 0; padding-top: 1px; }
    .device-title { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; line-height: 18px; font-weight: 650; }
    .device-id { display: block; margin-top: 1px; color: #8e9491; font-size: 10px; line-height: 15px; letter-spacing: .02em; }
    .chips { display: flex; gap: 5px; margin-top: 9px; min-width: 0; }
    .chip { max-width: 84px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: inline-flex; align-items: center; height: 21px; padding: 0 7px; border-radius: 6px; font-size: 9px; line-height: 1; font-weight: 600; }
    .chip.green { color: #6a9821; background: #edf5df; } .chip.red { color: #db5e55; background: #fff0ee; } .chip.amber { color: #bc8619; background: #fff5dc; } .chip.blue { color: #358fb5; background: #e9f5fa; }
    .device-meta { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; padding-top: 1px; }
    .last-label { display: block; color: #a1a6a3; font-size: 9px; line-height: 13px; white-space: nowrap; }
    .last-time { display: block; max-width: 100%; color: #535a56; font-size: 9px; line-height: 14px; text-align: right; white-space: nowrap; }
    .down-chevron { margin-top: auto; width: 23px; height: 23px; display: grid; place-items: center; border-radius: 50%; color: var(--green); background: #f1f7e8; }
    .down-chevron svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .empty-state { padding: 30px 14px; text-align: center; color: var(--muted); font-size: 13px; }
    .bottom-nav { min-height: 62px; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); align-items: center; padding: 3px 8px 0; border-top: 1px solid #eff0ed; background: rgba(255,255,255,.98); box-shadow: 0 -3px 14px #22291a08; }
    .nav-item { height: 56px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; border: 0; background: transparent; color: #969b98; font-size: 9px; line-height: 12px; font-weight: 550; }
    .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--green-dark); font-weight: 650; }
    .nav-item:focus-visible { outline: 2px solid #9cc95a; outline-offset: -3px; border-radius: 10px; }
    /* Locations */
    .map-screen { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; background: #e9eee6; }
    #interactive-map, #device-map { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; min-height: 0; background: #e9eee6; }
    .map-top { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 500; }
    .map-screen.full-map .map-top { top: 58px; }
    .map-screen.full-map .page-bar { position: absolute; z-index: 600; inset: 0 0 auto; }
    .map-screen .leaflet-top { top: 74px; }
    .map-screen.full-map .leaflet-top { top: 120px; }
    .leaflet-container { font: inherit; }
    .leaflet-control-zoom a { color: #4e5b4c !important; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .device-map-icon { border: 0; background: transparent; }
    .device-map-icon span { display: grid; width: 36px; height: 36px; place-items: center; border: 3px solid #fff; border-radius: 50% 50% 50% 8px; transform: rotate(-45deg); background: var(--marker-color,#82ae25); color: #fff; box-shadow: 0 2px 8px #20291d55; }
    .device-map-icon svg { width: 17px; height: 17px; transform: rotate(45deg); stroke: currentColor; fill: none; stroke-width: 1.8; }
    .map-fab { position: absolute; z-index: 500; right: 14px; bottom: 104px; width: 43px; height: 43px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #fff; color: #657065; box-shadow: var(--shadow); }
    .map-fab svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .map-bottom-caption, .map-empty-note { position: absolute; z-index: 400; left: 12px; bottom: 14px; max-width: calc(100% - 72px); padding: 8px 11px; border: 1px solid #e8ece4; border-radius: 10px; background: #ffffffed; color: #727a70; box-shadow: var(--shadow-soft); font-size: 11px; line-height: 1.4; }
    .map-empty-note { top: 70px; bottom: auto; max-width: calc(100% - 24px); color: #697568; }
    /* Analytics */
    .screen-title { margin: 5px 2px 13px; font-size: 19px; line-height: 24px; font-weight: 650; letter-spacing: -.35px; }
    .selector { width: 100%; min-height: 43px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 1px solid #e9ece7; border-radius: 10px; background: #fff; box-shadow: var(--shadow-soft); font-size: 12px; font-weight: 550; }
    .selector .leading { display: flex; align-items: center; gap: 8px; }
    .selector svg { width: 16px; height: 16px; fill: none; stroke: #818883; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .metric-list { display: grid; gap: 11px; margin-top: 12px; }
    .metric-card { padding: 13px 14px 11px; border-radius: 13px; background: #fff; box-shadow: var(--shadow); }
    .metric-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .metric-name { display: block; font-size: 12px; line-height: 16px; font-weight: 650; }
    .metric-caption { display: block; margin-top: 1px; color: #969c98; font-size: 9px; line-height: 13px; }
    .metric-menu { border: 0; padding: 0; width: 25px; height: 25px; display: grid; place-items: center; background: transparent; color: #9aa09c; }
    .metric-menu svg { width: 17px; height: 17px; fill: currentColor; }
    .gauge-wrap { position: relative; height: 94px; margin: 8px auto 4px; max-width: 215px; }
    .gauge-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .gauge-number { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); color: #348bb0; font-size: 27px; font-weight: 550; letter-spacing: -.6px; }
    .gauge-unit { position: absolute; bottom: 7px; left: calc(50% + 32px); color: #8d9697; font-size: 8px; }
    .gauge-scale { position: absolute; left: 9px; right: 9px; bottom: -1px; display: flex; justify-content: space-between; color: #a5aaa8; font-size: 8px; }
    .metric-value { margin-top: 15px; min-height: 56px; display: grid; place-items: center; color: var(--green-dark); font-size: 23px; line-height: 1.1; font-weight: 650; }
    .metric-value.off { color: #e37569; }
    .metric-footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; padding-top: 8px; border-top: 1px solid #f0f1ee; color: #a0a6a2; font-size: 8px; line-height: 12px; }
    .metric-footer span { white-space: nowrap; }
    /* Page bars */
    .page-bar { position: sticky; top: 0; z-index: 20; min-height: 48px; display: grid; grid-template-columns: 42px minmax(0,1fr) 42px; align-items: center; gap: 4px; padding: 0 10px; background: #fafafa; box-shadow: 0 2px 8px #20291d0a; }
    .page-bar h1 { margin: 0; text-align: center; font-size: 15px; font-weight: 650; }
    .page-bar .icon-btn { justify-self: center; }
    .page-bar .page-actions { display: flex; justify-content: flex-end; gap: 1px; }
    .page-bar.notifications-bar { grid-template-columns: 34px minmax(0,1fr); padding: 0 9px; gap: 5px; }
    .notification-search { min-height: 35px; display: flex; align-items: center; padding: 0 5px 0 9px; border-radius: 9px; background: #f7f8f6; }
    .notification-search input { flex: 1; min-width: 0; border: 0; outline: 0; height: 34px; background: transparent; font-size: 11px; }
    .notification-search input::placeholder { color: #a9afac; }
    .notification-search .icon-btn { width: 29px; height: 31px; }
    .notice-list { display: grid; }
    .notice-date { margin: 15px 17px 7px; color: #858c88; font-size: 10px; line-height: 14px; font-weight: 600; }
    .notice-row { min-height: 67px; display: grid; grid-template-columns: 38px minmax(0,1fr) auto; align-items: center; gap: 9px; padding: 8px 15px; border-bottom: 1px solid #edeeeb; background: #fff; }
    .notice-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
    .notice-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .notice-icon.red { color: #e45f57; background: #fff0ed; } .notice-icon.amber { color: #bf8c24; background: #fff6de; } .notice-icon.green { color: #729b30; background: #edf5df; } .notice-icon.blue { color: #3e94b4; background: #e7f3f7; }
    .notice-copy { min-width: 0; }
    .notice-title { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; line-height: 15px; font-weight: 650; }
    .notice-device { display: block; margin-top: 2px; color: #929895; font-size: 9px; line-height: 12px; }
    .notice-time { align-self: start; padding-top: 4px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; color: #9ba19e; font-size: 8px; line-height: 11px; white-space: nowrap; }
    .unread { min-width: 15px; height: 15px; display: inline-grid; place-items: center; padding: 0 4px; border-radius: 99px; background: var(--green); color: white; font-size: 8px; font-weight: 650; }
    /* Profile */
    .profile-view { padding: 11px 18px 20px; }
    .profile-heading { margin: 4px 0 15px; text-align: center; font-size: 18px; line-height: 24px; font-weight: 650; }
    .profile-hero { display: flex; flex-direction: column; align-items: center; padding: 7px 0 19px; }
    .avatar { width: 82px; height: 82px; overflow: hidden; border-radius: 50%; display: grid; place-items: center; border: 3px solid #fff; background: linear-gradient(145deg,#e7efdc,#c9dcb0); box-shadow: 0 2px 10px #34462620; color: #688e2c; }
    .avatar svg { width: 72px; height: 72px; }
    .profile-name { display: block; margin-top: 10px; font-size: 15px; line-height: 19px; font-weight: 650; }
    .profile-email { display: block; margin-top: 3px; color: #969c98; font-size: 10px; line-height: 14px; }
    .profile-menu { overflow: hidden; border-radius: 13px; background: #fff; box-shadow: var(--shadow); }
    .menu-row { width: 100%; min-height: 53px; display: grid; grid-template-columns: 26px minmax(0,1fr) 16px; align-items: center; gap: 11px; padding: 0 14px; border: 0; border-bottom: 1px solid #f0f1ee; background: #fff; text-align: left; }
    .menu-row:last-child { border-bottom: 0; }
    .menu-row .line-icon { width: 18px; height: 18px; color: var(--green-dark); }
    .menu-label { font-size: 11px; line-height: 15px; font-weight: 550; }
    .menu-value { display: block; margin-top: 2px; color: #9ba19e; font-size: 9px; line-height: 12px; font-weight: 400; }
    .menu-chevron { width: 15px; height: 15px; stroke: #aeb4b0; fill: none; stroke-width: 1.7; }
    .logout-row { width: 100%; min-height: 49px; margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 0 15px; border: 0; border-radius: 12px; background: #fff; color: #df655b; box-shadow: var(--shadow-soft); text-align: left; font-size: 11px; font-weight: 600; }
    .logout-row svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    /* Detail and edit */
    .detail-body { padding: 12px 15px 22px; }
    .detail-summary { display: grid; grid-template-columns: 65px minmax(0,1fr); gap: 12px; align-items: center; padding: 12px; border-radius: 13px; background: #fff; box-shadow: var(--shadow); }
    .detail-summary .device-visual { width: 63px; height: 63px; }
    .detail-summary .device-visual svg { width: 46px; height: 46px; }
    .detail-summary .device-title { font-size: 14px; }
    .detail-last { margin-top: 5px; color: #959b98; font-size: 9px; line-height: 14px; }
    .detail-id { color: #747b77; font-size: 9px; line-height: 14px; }
    .detail-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .detail-field { min-height: 55px; padding: 9px 10px; border-radius: 10px; background: #fff; box-shadow: var(--shadow-soft); }
    .detail-field label { display: block; color: #a0a6a2; font-size: 9px; line-height: 12px; }
    .detail-field strong { display: block; margin-top: 4px; font-size: 10px; line-height: 13px; font-weight: 600; }
    .more-button { width: 100%; min-height: 34px; margin-top: 7px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 0; border-radius: 9px; color: #719b2a; background: #eef5e3; font-size: 10px; font-weight: 600; }
    .more-button svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
    .detail-section-title { margin: 14px 2px 8px; font-size: 12px; line-height: 16px; font-weight: 650; }
    .output-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .output-card { min-height: 76px; position: relative; padding: 10px; border-radius: 11px; background: #fff; box-shadow: var(--shadow-soft); }
    .output-card span { display: block; color: #909792; font-size: 9px; line-height: 13px; }
    .output-card strong { display: block; margin-top: 5px; font-size: 13px; line-height: 16px; font-weight: 650; }
    .output-state { position: absolute; right: 10px; bottom: 10px; width: 12px; height: 12px; border: 3px solid #dff0bc; border-radius: 50%; background: var(--green); }
    .output-state.red { border-color: #fde1dd; background: var(--red); } .output-state.amber { border-color: #fff0c7; background: var(--amber); }
    .mini-map { height: 220px; position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: #eef0e3; box-shadow: var(--shadow-soft); }
    .mini-map-button { width: 100%; min-height: 37px; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #e4ebd9; border-radius: 9px; background: #f3f8ea; color: #70962b; font-size: 10px; font-weight: 600; }
    .mini-map-button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .action-secondary, .action-primary { min-height: 39px; padding: 0 9px; border-radius: 9px; font-size: 10px; font-weight: 600; }
    .action-secondary { border: 1px solid #e4e8df; background: #fff; color: #69716a; }
    .action-primary { border: 0; background: var(--green); color: #fff; box-shadow: 0 2px 5px #81af2738; }
    .edit-avatar-row { display: flex; justify-content: center; margin: 13px 0 16px; }
    .edit-avatar { position: relative; }
    .avatar-edit { position: absolute; right: -2px; bottom: 0; width: 25px; height: 25px; display: grid; place-items: center; border: 2px solid #fff; border-radius: 50%; background: var(--green); color: white; }
    .avatar-edit svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
    .form-list { display: grid; gap: 9px; }
    .form-field { min-height: 51px; display: grid; grid-template-columns: 25px minmax(0,1fr); align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid #eceeea; border-radius: 10px; background: #fff; }
    .form-field svg { width: 17px; height: 17px; stroke: #8cae50; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .form-field input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 11px; }
    .form-field input::placeholder { color: #a4aaa6; }
    /* Sheets */
    .scrim { position: absolute; z-index: 30; inset: 0; display: flex; align-items: flex-end; background: #111a16a6; opacity: 1; transition: opacity .18s ease; }
    .sheet { width: 100%; max-height: 83%; overflow: auto; padding: 8px 18px 22px; border-radius: 20px 20px 0 0; background: #fff; box-shadow: 0 -8px 28px #0c120e25; animation: sheet-in .22s ease-out; }
    @keyframes sheet-in { from { transform: translateY(20px); opacity: .7; } to { transform: translateY(0); opacity: 1; } }
    .sheet-grabber { width: 34px; height: 4px; margin: 1px auto 13px; border-radius: 4px; background: #d8ddd7; }
    .sheet h2 { margin: 0; text-align: center; font-size: 16px; line-height: 22px; font-weight: 650; }
    .sheet-subtitle { margin: 5px auto 17px; max-width: 270px; color: #969d98; text-align: center; font-size: 10px; line-height: 15px; }
    .downlink-illustration { width: 86px; height: 62px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 12px; background: #f4f8ed; color: var(--green); }
    .downlink-illustration svg { width: 49px; height: 49px; stroke: currentColor; fill: none; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .sheet-field { min-height: 46px; margin-top: 9px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 1px solid #e6eae2; border-radius: 9px; color: #505851; background: #fff; font-size: 11px; }
    .sheet-field .field-label { color: #9ba29b; font-size: 9px; }
    .sheet-field select { width: 56%; border: 0; outline: 0; appearance: none; background: transparent; text-align: right; font-size: 10px; }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1.3fr; gap: 9px; margin-top: 16px; }

      overlayRoot.innerHTML=`<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grabber"></div><h2 id="sheet-title">Organizations</h2><p class="sheet-subtitle">Choose an organization</p><div class="filter-options"><button class="filter-option" data-action="choose-org" type="button"><span>SenRa IoT</span>${svg('check')}</button><button class="filter-option" data-action="choose-org" type="button"><span>Demo organization</span>${svg('chevron')}</button></div><div class="sheet-actions"><button class="action-secondary" data-action="close" type="button">Close</button></div></section></div>`;
      overlayRoot.querySelector('[data-action="close"]').addEventListener('click',()=>overlayRoot.innerHTML='');
      overlayRoot.querySelectorAll('[data-action="choose-org"]').forEach(b=>b.addEventListener('click',()=>{overlayRoot.innerHTML='';showToast(`${b.querySelector('span').textContent} selected`);}));
    }
    function openDashboard() {
      overlayRoot.innerHTML=`<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-grabber"></div><h2 id="sheet-title">Select dashboard</h2><div class="filter-options"><button class="filter-option" data-action="select-dashboard" type="button"><span>Public Dashboard</span>${svg('check')}</button><button class="filter-option" data-action="select-dashboard" type="button"><span>Device health</span>${svg('chevron')}</button></div><div class="sheet-actions"><button class="action-secondary" data-action="close" type="button">Close</button></div></section></div>`;
      overlayRoot.querySelector('[data-action="close"]').addEventListener('click',()=>overlayRoot.innerHTML='');
      overlayRoot.querySelectorAll('[data-action="select-dashboard"]').forEach(b=>b.addEventListener('click',()=>{overlayRoot.innerHTML='';showToast(`${b.querySelector('span').textContent} selected`);}));
    }
    render();
  </script>
